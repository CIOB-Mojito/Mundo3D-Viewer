<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Visor 3D</title>
<style>
  :root{
    --bg:#0b0d12;
    --panel:rgba(20,23,32,.86);
    --panel-border:rgba(255,255,255,.10);
    --text:#eef1f7;
    --muted:#9aa3b5;
    --accent:#4f8cff;
    --accent-soft:rgba(79,140,255,.18);
    --danger:#ff5d6c;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  html.light{
    --bg:#eef1f6;
    --panel:rgba(255,255,255,.9);
    --panel-border:rgba(0,0,0,.10);
    --text:#12151c;
    --muted:#5a6272;
    --accent:#2f6bff;
    --accent-soft:rgba(47,107,255,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  /* ---------- Topbar ---------- */
  #topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
    justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
    pointer-events:none;}
  .chip{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:14px;padding:8px 12px;backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);font-size:14px;font-weight:600;max-width:62vw;}
  #modelName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .dot.busy{background:#ffb020;animation:pulse 1s infinite;}
  .dot.err{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:12px;background:var(--panel);
    border:1px solid var(--panel-border);color:var(--text);display:grid;place-items:center;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;}
  .iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .iconbtn:active{transform:scale(.94);}
  /* ---------- Canvas ---------- */
  #view{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;touch-action:none;}
  /* ---------- Loader ---------- */
  #loading{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:rgba(11,13,18,.72);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .3s;padding:24px;text-align:center;}
  #loading.hidden{opacity:0;pointer-events:none;}
  .spinner{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.18);
    border-top-color:var(--accent);animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadText{font-size:15px;color:var(--text);font-weight:600;}
  #loadPct{font-size:13px;color:var(--muted);}
  #progressWrap{width:min(320px,80vw);height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;}
  #progressBar{height:100%;width:0;background:var(--accent);transition:width .2s;}
  /* ---------- Error ---------- */
  #errorBox{display:none;max-width:460px;background:var(--panel);border:1px solid var(--danger);
    border-radius:16px;padding:18px;text-align:left;}
  #errorBox h3{margin:0 0 8px;font-size:16px;color:var(--danger);}
  #errorBox p{margin:0 0 10px;font-size:13px;line-height:1.5;color:var(--text);}
  #errorBox code{background:rgba(255,255,255,.10);padding:2px 6px;border-radius:6px;font-size:12px;}
  #errorBox button{margin-top:6px;background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  /* ---------- Bottom panel ---------- */
  #panel{position:absolute;left:0;right:0;bottom:0;z-index:20;
    background:var(--panel);border-top:1px solid var(--panel-border);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    padding:12px 12px calc(12px + var(--safe-b));display:flex;flex-direction:column;gap:12px;}
  /* Horizontal, touch-scrollable model bar (one row of compact cards) */
  #modelsWrap{position:relative;margin:0 -12px;}
  #models{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;
    touch-action:pan-x;overscroll-behavior-x:contain;padding:2px 12px;}
  #models::-webkit-scrollbar{display:none;}
  .modelbtn{flex:0 0 auto;scroll-snap-align:start;min-width:84px;max-width:44vw;min-height:50px;
    padding:8px 14px;border-radius:14px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.05);color:var(--text);font-size:14px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s;}
  .modelbtn small{font-size:10px;font-weight:500;color:var(--muted);}
  .modelbtn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text);
    box-shadow:0 4px 14px rgba(79,140,255,.24);}
  .modelbtn.active small{color:var(--accent);}
  .modelbtn:active{transform:scale(.97);}
  /* Subtle edge fades hint that the row scrolls (enabled by JS) */
  #modelsWrap::before,#modelsWrap::after{content:"";position:absolute;top:2px;bottom:2px;width:26px;
    pointer-events:none;z-index:2;opacity:0;transition:opacity .2s;}
  #modelsWrap::before{left:0;background:linear-gradient(90deg,var(--panel),transparent);}
  #modelsWrap::after{right:0;background:linear-gradient(270deg,var(--panel),transparent);}
  #modelsWrap.can-left::before{opacity:1;}
  #modelsWrap.can-right::after{opacity:1;}
  #quality{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .qbtn{min-height:40px;border-radius:12px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.05);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
  .qbtn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .qbtn:active{transform:scale(.97);}
  #tools{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .tool{min-height:56px;border-radius:14px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.05);color:var(--muted);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600;cursor:pointer;
    padding:4px;line-height:1.1;text-align:center;}
  .tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .tool:active{transform:scale(.95);}
  /* ---------- Box open/close control (only for the premium box model) ---------- */
  #boxControls{display:none;}
  #boxControls.show{display:block;}
  #btnBox{width:100%;flex-direction:row;gap:8px;min-height:48px;font-size:13px;}
  /* ---------- Animations row ---------- */
  #anims{display:flex;align-items:stretch;gap:8px;height:56px;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #anims::-webkit-scrollbar{display:none;}
  #btnAddAnim{flex:0 0 56px;}
  .animchip{flex:0 0 auto;min-height:52px;padding:0 14px;border-radius:14px;
    border:1px solid var(--panel-border);background:rgba(255,255,255,.05);color:var(--muted);
    font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;}
  .animchip .led{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45;}
  .animchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .animchip.on .led{opacity:1;}
  .animchip:active{transform:scale(.96);}
  /* ---------- Animation menu ---------- */
  #animMenu{position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);z-index:25;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;padding:12px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.45);}
  #animMenu.on{display:block;}
  #animMenu .mtitle{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--text);}
  #animMenuList{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .menuitem{min-height:46px;border-radius:12px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.05);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .menuitem:active{transform:scale(.97);}
  .menuitem .plus{color:var(--accent);font-weight:800;font-size:16px;line-height:1;}
  #animMenu .mfoot{margin-top:10px;display:flex;gap:8px;}
  #animMenu .mfoot button{flex:1;min-height:42px;border-radius:12px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.05);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;}
  #animMenu .mfoot button:active{transform:scale(.97);}
  #fpsBadge{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;
    transform:translateX(-50%);z-index:21;pointer-events:none;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:10px;padding:4px 10px;font-size:12px;
    font-weight:700;color:var(--accent);display:none;font-variant-numeric:tabular-nums;}
  #fpsBadge.on{display:block;}
  #hint{position:absolute;left:0;right:0;bottom:362px;z-index:15;text-align:center;
    font-size:12px;color:var(--muted);padding:0 16px;pointer-events:none;transition:opacity .6s;}
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="hint">Arrastra para rotar · Pellizca para zoom · Dos dedos para mover</div>

  <div id="topbar">
    <div class="chip"><span class="dot" id="statusDot"></span><span id="modelName">—</span></div>
    <button class="iconbtn" id="btnFps" title="Mostrar FPS" aria-label="Mostrar FPS">
      <svg viewBox="0 0 24 24"><path d="M3 13h3l2.5-6 3 11 2.5-6H21"/></svg>
    </button>
    <button class="iconbtn" id="btnFullscreen" title="Pantalla completa" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
  <div id="fpsBadge">— FPS</div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadText">Cargando visor…</div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="loadPct"></div>
    <div id="errorBox">
      <h3>No se pudo cargar el modelo</h3>
      <p id="errorMsg"></p>
      <p id="errorHint"></p>
      <button id="btnRetry">Reintentar</button>
    </div>
  </div>

  <div id="panel">
    <div id="modelsWrap">
      <div id="models">
        <button class="modelbtn active" data-model="Carro.glb" data-label="Carro">Carro<small>Carro.glb · 6 MB</small></button>
        <button class="modelbtn" data-model="conejo.glb" data-label="Conejo">Conejo<small>conejo.glb · 26 MB</small></button>
        <button class="modelbtn" data-model="Conejoo.glb" data-label="Conejoo">Conejoo<small>Conejoo.glb · 39 MB</small></button>
        <button class="modelbtn" data-model="CarroPro.glb" data-label="CarroPro">CarroPro<small>CarroPro.glb · 354 KB</small></button>
        <button class="modelbtn" data-model="Caja.glb" data-label="Caja">Caja<small>Caja.glb · 883 KB</small></button>
        <button class="modelbtn" data-model="Ratón.glb" data-label="Ratón">Ratón<small>Ratón.glb · 23 MB</small></button>
        <button class="modelbtn" data-model="Huesped.glb" data-label="Huesped">Huesped<small>Huesped.glb · 953 KB</small></button>
        <button class="modelbtn" data-model="No lo se.glb" data-label="No lo sé">No lo sé<small>No lo se.glb · 33 MB</small></button>
        <button class="modelbtn" data-model="Huesped-v2.glb" data-label="Huesped v2">Huesped v2<small>Huesped-v2.glb · 5 MB</small></button>
        <button class="modelbtn" data-model="mystery-box-01.glb" data-label="Caja sorpresa">Caja sorpresa<small>mystery-box-01.glb · 3 MB</small></button>
        <button class="modelbtn" data-model="mystery_box-premiun.glb" data-label="Caja Premium">Caja Premium<small>mystery_box-premiun.glb · 19 MB</small></button>
      </div>
    </div>
    <div id="quality">
      <button class="qbtn" data-q="calidad">Calidad</button>
      <button class="qbtn" data-q="equilibrado">Equilibrado</button>
      <button class="qbtn active" data-q="rendimiento">Rendimiento</button>
    </div>
    <div id="anims">
      <button class="tool" id="btnAddAnim" title="Añadir animación" aria-label="Añadir animación">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Anim
      </button>
    </div>
    <div id="tools">
      <button class="tool" id="btnRotate">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Rotación
      </button>
      <button class="tool" id="btnLight">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Fondo claro
      </button>
      <button class="tool" id="btnGround">
        <svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V9l6-4 6 4v11"/></svg>
        Suelo
      </button>
      <button class="tool" id="btnShadow">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 16v5M12 3v5M4 12h5M15 12h5" opacity=".55"/><path d="M20 20H9"/></svg>
        Sombras
      </button>
      <button class="tool" id="btnReset">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>
        Centrar
      </button>
    </div>
    <div id="boxControls">
      <button class="tool" id="btnBox"><span id="btnBoxLabel">📦 Abrir caja</span></button>
    </div>
    <div id="animMenu">
      <p class="mtitle">Añadir animación</p>
      <div id="animMenuList"></div>
      <div class="mfoot">
        <button id="btnClearAnims">Quitar todas</button>
        <button id="btnCloseAnim">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const canvas = $('view');
const statusDot = $('statusDot');
const modelName = $('modelName');
const loadingEl = $('loading');
const loadText = $('loadText');
const loadPct = $('loadPct');
const progressBar = $('progressBar');
const errorBox = $('errorBox');
const errorMsg = $('errorMsg');
const errorHint = $('errorHint');
const hint = $('hint');
const panelEl = $('panel');
const topbarEl = $('topbar');
const fpsBadge = $('fpsBadge');

const DARK_BG = 0x0b0d12;
const LIGHT_BG = 0xeef1f6;

// ---- Device detection & quality profiles ------------------------------------
// Coarse pointer / small screen => treat as mobile and pick a safer profile.
const isMobile = matchMedia('(pointer: coarse)').matches
  || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
  || Math.min(screen.width, screen.height) < 820;

// dprMax caps renderer.setPixelRatio(); shadows/lights are per-profile effects.
const QUALITY = {
  calidad:     { dprMax: 2.0,  shadows: true,  mapSize: 2048, lights: true  },
  equilibrado: { dprMax: 1.25, shadows: false, mapSize: 1024, lights: true  },
  rendimiento: { dprMax: 1.0,  shadows: false, mapSize: 512,  lights: false }
};
let qualityKey = 'rendimiento';   // default profile: Rendimiento

let renderer, scene, controls, camera;
let lights = null;       // { ambient, key, fill, rim }
let envMap = null;
let ground = null;
let current = null;      // { root, file, label }
let loadToken = 0;       // guards against stale async loads
let shadowEnabled = false;
let autoRotate = false;
let fitInfo = null;      // { radius, size }

// On-demand rendering: only redraw when the camera/scene actually changed.
let needsRender = true;
let resizeTimer = null;

// FPS meter (optional, off by default)
let fpsEnabled = false, fpsCount = 0, fpsPrev = performance.now();

// Procedural animations (no GLB/skeleton dependency: they transform the model
// root group only). Each instance toggles independently; several can run at once.
const ANIM_TYPES = {
  spin:  { name: 'Giro',      amp: 0,    apply: (c) => { c.root.rotation.y = c.base.rot.y + c.t * 1.2 + c.phase; } },
  float: { name: 'Flotar',    amp: 0.15, apply: (c) => { c.root.position.y = c.base.pos.y + Math.sin(c.t * 1.6 + c.phase) * c.amp; } },
  rock:  { name: 'Balanceo',  amp: 0,    apply: (c) => { c.root.rotation.z = c.base.rot.z + Math.sin(c.t * 1.3 + c.phase) * 0.16; } },
  pulse: { name: 'Pulso',     amp: 0,    apply: (c) => {
            const s = 1 + Math.sin(c.t * 2.2 + c.phase) * 0.06;
            c.root.scale.set(c.base.scale.x * s, c.base.scale.y * s, c.base.scale.z * s);
          } },
  orbit: { name: 'Órbita',    amp: 0.18, apply: (c) => {
            c.root.position.x = c.base.pos.x + Math.cos(c.t * 1.1 + c.phase) * c.amp;
            c.root.position.z = c.base.pos.z + Math.sin(c.t * 1.1 + c.phase) * c.amp;
          } }
};
let animInstances = [];   // { key, type, name, active, phase }
let animSeq = 0;
let animBase = null;      // rest transform of the current model root
let animWasActive = false;
const animCtx = { root: null, base: null, t: 0, phase: 0, amp: 0 };  // reused (no per-frame alloc)

// Premium box ("Caja Premium"): this GLB ships its own baked opening clip
// ("Flap_Open_Close", LINEAR, 5.4 s) driving four real flap nodes
// (Flap_Front/Back/Left/Right). We reuse that clip through a THREE.AnimationMixer and
// scrub its time with the ORIGINAL choreography phase (open 0 -> 0.45, close travels
// forward to 0), so the motion is the model's own. The constants below mirror
// buildBox.ts and are only used to rebuild a faithful clip if one were ever missing.
let premiumState = null;   // { root, mixer, action, clip, duration, phase, open, animating, lastT, content }
const PREMIUM_FLAPS = ['Flap_Front', 'Flap_Back', 'Flap_Left', 'Flap_Right'];
const PREMIUM_PIVOTS = {
  Flap_Front: { axis: new THREE.Vector3(1, 0, 0), sign:  1 },
  Flap_Back:  { axis: new THREE.Vector3(1, 0, 0), sign: -1 },
  Flap_Left:  { axis: new THREE.Vector3(0, 0, 1), sign:  1 },
  Flap_Right: { axis: new THREE.Vector3(0, 0, 1), sign: -1 }
};
const PREMIUM_OPEN_ANGLE = 112 * Math.PI / 180;   // buildBox.ts OPEN_ANGLE (deg -> rad)
const PREMIUM_CYCLE = 5.4;                         // buildBox.ts CYCLE_SECONDS
const PREMIUM_HOLD_OPEN = 0.45;                    // buildBox.ts HOLD_OPEN_PHASE
const PREMIUM_TRAVEL_SPEED = 1 / 3.4;              // buildBox.ts transport: full cycle / 3.4 s

// --- Sequential surprise content of the premium box ---------------------------
// Every time the box is OPENED it reveals the NEXT eligible model from the
// viewer's own selector (all models except the two boxes). A session-persistent
// index advances only on open (never on close) and wraps around at the end.
// Prepared models are cached and reused; a failed load is logged and skipped so
// the box never blocks.
// Cinematic reveal in three beats: (A) the character rises out of the cavity once
// the flaps have cleared, (B) it glides toward the camera to become the subject,
// (C) it floats gently in front of / above the box until the user closes it.
// The close is the mirror: it recedes back over the box, sinks inside, hides.
// Flap/content timing was validated offline against the buildBox.ts geometry
// (majors clear the opening by phase 0.21, minors by 0.39); the retreat+descent
// finishes before the minors close (retreat 300 ms + sink 600 ms = 900 ms < 1.05 s).
const CONTENT_EXCLUDE = ['mystery-box-01.glb', 'mystery_box-premiun.glb'];
const CONTENT_CACHE_MAX = 4;       // LRU cap on prepared models (bounds RAM/VRAM on Android)
let contentSequence = null;        // eligible files in selector order (built lazily from the DOM)
let contentSeqIndex = 0;           // session-persistent index: advances on every open
const contentCache = new Map();    // file -> { croot, scale0, contentH } (prepared & reused)
const CONTENT_OPEN_DELAY = 1100;   // ms after "Abrir caja" until the lift begins (A)
const CONTENT_RISE_MS = 1000;      // duration of the vertical rise (A)
const CONTENT_RISE_BOOST = 0.30;   // final rise height: +30% over the base vertical travel (A)
// (B) approach: glide toward the camera along the live view direction.
const CONTENT_APPROACH_FRAC = 0.20; // travel = 20% of the camera→object distance (15–25% range)
const CONTENT_APPROACH_MS = 850;    // duration of the toward-camera move
const CONTENT_DISPLAY_SCALE = 1.12; // stable exhibition scale once presented (× scale0)
const CONTENT_CURVE = 0.14;         // gentle lateral curve of the approach (fraction of travel)
const CONTENT_ARC_LIFT = 0.10;      // gentle upward arc of the approach (fraction of travel)
// (C) presentation: subtle idle float (reuses the same holder/light/halo — no copies).
const CONTENT_FLOAT_AMP = 0.10;     // idle float amplitude (fraction of the content height)
const CONTENT_FLOAT_MS = 4200;      // idle float period
const CONTENT_PAUSE_MS = 800;       // glow fade at the start of the presentation
// Close: recede back over the box, then descend into the cavity.
const CONTENT_RETREAT_MS = 300;     // duration of the retreat (back over the box)
const CONTENT_SINK_MS = 600;        // duration of the descent (ends before the minors close)

// --- Mystery box ("Caja sorpresa", mystery-box-01.glb) ------------------------
// This box ships NO usable clip (its embedded "Open_and_Close" has 0 tracks), so
// its four flap pivots are driven directly with the original builder's staggered
// choreography (App.tsx setOpen): angle 2.18 rad, open stagger 145 ms, close
// stagger 105 ms, open 1050 ms, close 820 ms, easeOutCubic. Front/back rotate on
// the local X axis and left/right on the local Z axis, with signs +, -, +, -.
// Only one box model is ever loaded at a time, so premiumState and mysteryState
// never animate together (the open/close button dispatches to whichever exists).
let mysteryState = null;   // { root, entries, open, animating }
const MYSTERY_OPEN_ANGLE = 2.18;
const MYSTERY_OPEN_STAGGER = 145;
const MYSTERY_CLOSE_STAGGER = 105;
const MYSTERY_OPEN_MS = 1050;
const MYSTERY_CLOSE_MS = 820;
const MYSTERY_FLAPS = [
  { node: 'Pivot_Flap_Front', axis: 'x', angle:  MYSTERY_OPEN_ANGLE },
  { node: 'Pivot_Flap_Back',  axis: 'x', angle: -MYSTERY_OPEN_ANGLE },
  { node: 'Pivot_Flap_Left',  axis: 'z', angle:  MYSTERY_OPEN_ANGLE },
  { node: 'Pivot_Flap_Right', axis: 'z', angle: -MYSTERY_OPEN_ANGLE }
];

init();
loadModel('Carro.glb', 'Carro');

/* ============================ SETUP ============================ */
function init(){
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: !isMobile,          // MSAA is expensive on mobile GPUs
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  // Shadows are set up but NOT recomputed every frame: with autoUpdate=false the
  // depth pass over the (heavy) model only runs once, on demand.
  renderer.shadowMap.enabled = false;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = false;
  renderer.shadowMap.type = THREE.PCFShadowMap;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(DARK_BG);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 10000);
  camera.position.set(0, 2, 6);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.9;
  controls.zoomSpeed = 0.9;
  controls.panSpeed = 0.8;
  controls.screenSpacePanning = true;
  controls.autoRotateSpeed = 1.8;
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  controls.addEventListener('change', () => { needsRender = true; });

  // Environment for PBR (IMPORTANT: conejo uses metallicFactor 1). Built once.
  const pmrem = new THREE.PMREMGenerator(renderer);
  envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environment = envMap;
  pmrem.dispose();

  addLights();
  buildGround();
  bindUI();
  applyQuality(qualityKey);   // applies pixelRatio, shadows, lights for the profile

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  document.addEventListener('fullscreenchange', onResize);
  hideHintOnInteract();

  requestAnimationFrame(loop);   // drive the render loop with rAF (no setAnimationLoop)
}

function addLights(){
  const ambient = new THREE.AmbientLight(0xffffff, 0.55);
  ambient.name = 'ambient';
  scene.add(ambient);

  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.name = 'key';
  key.position.set(4, 6, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 0.1;
  key.shadow.camera.far = 50;
  key.shadow.bias = -0.0008;
  key.shadow.normalBias = 0.02;
  scene.add(key);
  scene.add(key.target);

  const fill = new THREE.DirectionalLight(0x9fb6ff, 0.9);
  fill.name = 'fill';
  fill.position.set(-5, 3, -4);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xffffff, 0.6);
  rim.name = 'rim';
  rim.position.set(0, 2, -6);
  scene.add(rim);

  lights = { ambient, key, fill, rim };
}

function buildGround(){
  if (ground) return;
  const geo = new THREE.CircleGeometry(1, 64);
  geo.rotateX(-Math.PI/2);
  const mat = new THREE.MeshStandardMaterial({ color:0x1a1f2b, roughness:0.9, metalness:0.0 });
  ground = new THREE.Mesh(geo, mat);
  ground.name = 'ground';
  ground.receiveShadow = true;
  ground.visible = false;   // no visual floor: model floats over the background
  scene.add(ground);
}

/* ============================ LOADING ============================ */
function loadModel(file, label){
  const token = ++loadToken;
  applyQuality('rendimiento');   // every model open/selection starts at Rendimiento
  resetBoxes();                  // stop/cache any box controller from the previous model
  showLoading(label);

  // Dispose previous model first (free GPU memory)
  if (current){
    disposeModel(current.root);
    scene.remove(current.root);
    current = null;
  }

  const url = new URL(file, location.href).href;
  const loader = new GLTFLoader();

  loader.load(
    url,
    (gltf) => {
      if (token !== loadToken) { disposeModel(gltf.scene); return; } // stale
      const root = gltf.scene;
      root.traverse((o) => {
        if (o.isMesh){
          o.castShadow = true;
          o.receiveShadow = true;
          if (o.material && 'envMapIntensity' in o.material) o.material.envMapIntensity = 1.0;
        }
      });
      current = { root, file, label };
      scene.add(root);
      fitModel(root);
      setupMysteryBox(root);                    // "Caja sorpresa": four Pivot_Flap_* nodes
      if (!mysteryState) setupPremiumBox(root, gltf.animations);   // "Caja Premium": baked Flap_Open_Close clip
      // (the two boxes share the generic Flap_* names on their children, so the
      //  mystery box — identified by its Pivot_Flap_* nodes — is resolved first)
      // Rest transform for procedural animations (relative to the centered model)
      animBase = { pos: root.position.clone(), rot: root.rotation.clone(), scale: root.scale.clone() };
      animWasActive = false;
      renderer.shadowMap.needsUpdate = true;   // refresh shadow map once for the new model
      needsRender = true;
      modelName.textContent = label;
      statusDot.className = 'dot';
      hideLoading();
    },
    (evt) => {
      if (token !== loadToken) return;
      if (evt.total){
        const p = Math.min(100, Math.round((evt.loaded / evt.total) * 100));
        progressBar.style.width = p + '%';
        loadPct.textContent = p + '%  (' + fmtBytes(evt.loaded) + ' / ' + fmtBytes(evt.total) + ')';
      } else {
        progressBar.style.width = '100%';
        loadPct.textContent = fmtBytes(evt.loaded);
      }
    },
    (err) => {
      if (token !== loadToken) return;
      showError(file, err);
    }
  );
}

function fitModel(root){
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()){
    fitInfo = { radius: 1, size: new THREE.Vector3(1, 1, 1) };
    resetCamera();
    return;
  }

  const center = box.getCenter(new THREE.Vector3());

  // Move the model so its REAL bounding-box center sits at the origin.
  // Only the root transform changes: geometry and materials stay untouched.
  root.position.sub(center);
  root.updateWorldMatrix(true, true);

  // Recompute box after centering for accurate bounds and ground placement
  const box2 = new THREE.Box3().setFromObject(root);
  const size2 = box2.getSize(new THREE.Vector3());
  const maxDim = Math.max(size2.x, size2.y, size2.z) || 1;

  // Bounding-sphere radius fits the whole model at ANY orientation
  const radius = Math.max(size2.length() * 0.5, 0.0001);
  fitInfo = { radius, size: size2 };

  // Ground sized and placed at model bottom
  const groundR = Math.max(maxDim * 1.6, radius * 1.2);
  ground.scale.set(groundR, 1, groundR);
  ground.position.y = box2.min.y;

  resetCamera();
}

// Distance so the bounding sphere fits inside BOTH the vertical AND horizontal
// field of view. On narrow portrait screens the horizontal FOV is the tighter
// one, so fitting only the vertical FOV used to overflow / clip the model.
function computeFitDistance(){
  const radius = fitInfo ? fitInfo.radius : 1;
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const aspect = Math.max(camera.aspect, 0.0001);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const fitFov = Math.min(vFov, hFov);
  return { radius, vFov, dist: (radius / Math.sin(fitFov / 2)) * 1.15 };
}

// World Y offset for the orbit target so the model appears centred inside the
// free area (below the top bar, above the bottom control panel) instead of the
// geometric centre of the screen, which the panel would cover.
function computeTargetOffsetY(dist, vFov){
  const H = renderer.domElement.clientHeight || window.innerHeight || 1;
  const topbarBottom = topbarEl ? topbarEl.getBoundingClientRect().bottom : 0;
  const panelTop = panelEl ? panelEl.getBoundingClientRect().top : H;
  const freeCenterY = (topbarBottom + panelTop) / 2;   // px from viewport top
  const ndcY = 1 - 2 * (freeCenterY / H);              // +1 top, -1 bottom
  const halfH = dist * Math.tan(vFov / 2);             // world half-height at target
  return -ndcY * halfH;
}

function applyProjection(dist, radius){
  camera.near = Math.max(dist * 0.01, radius * 0.001, 0.0001);
  camera.far = (dist + radius) * 8;
  camera.updateProjectionMatrix();
}

// Full reset: recenter, refit distance and return to a comfortable 3/4 view.
function resetCamera(){
  const { radius, vFov, dist } = computeFitDistance();
  applyProjection(dist, radius);

  const target = new THREE.Vector3(0, computeTargetOffsetY(dist, vFov), 0);
  const dir = new THREE.Vector3(0.35, 0.30, 1.0).normalize();

  camera.position.copy(target).addScaledVector(dir, dist);
  controls.target.copy(target);
  controls.minDistance = radius * 0.2;
  controls.maxDistance = dist * 5;
  controls.update();

  updateShadowCamera(radius);
  needsRender = true;
}

// Refit after resize / orientation / fullscreen changes, keeping the user's
// current viewing direction so their rotation is not lost.
function reframeCamera(preserveDirection){
  const { radius, vFov, dist } = computeFitDistance();
  applyProjection(dist, radius);

  const target = new THREE.Vector3(0, computeTargetOffsetY(dist, vFov), 0);
  let dir = camera.position.clone().sub(controls.target);
  if (!preserveDirection || dir.lengthSq() < 1e-8){
    dir = new THREE.Vector3(0.35, 0.30, 1.0);
  }
  dir.normalize();

  camera.position.copy(target).addScaledVector(dir, dist);
  controls.target.copy(target);
  controls.minDistance = radius * 0.2;
  controls.maxDistance = dist * 5;
  controls.update();

  updateShadowCamera(radius);
  needsRender = true;
}

function updateShadowCamera(radius){
  const key = scene.getObjectByName('key');
  if (!key) return;
  const cam = key.shadow.camera;
  const d = radius * 1.6;
  cam.left = -d; cam.right = d; cam.top = d; cam.bottom = -d;
  // Keep light close to model bounding sphere
  key.position.set(radius * 2, radius * 2.5, radius * 2);
  key.shadow.camera.near = 0.1;
  key.shadow.camera.far = radius * 12;
  cam.updateProjectionMatrix();
  renderer.shadowMap.needsUpdate = true;   // frustum changed: redo the depth pass once
}

/* ============================ QUALITY ============================ */
function applyPixelRatio(){
  const q = QUALITY[qualityKey] || QUALITY.equilibrado;
  // Never render above the device pixel ratio; cap it per profile.
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q.dprMax));
}

function setShadows(on){
  shadowEnabled = on;
  renderer.shadowMap.enabled = on;
  const btn = $('btnShadow');
  if (btn) btn.classList.toggle('on', on);
  if (on) renderer.shadowMap.needsUpdate = true;  // one-shot depth pass
  needsRender = true;
}

function applyQuality(key){
  qualityKey = key;
  const q = QUALITY[key] || QUALITY.equilibrado;

  applyPixelRatio();

  // Extra fill/rim lights are the first thing to drop on low-end profiles.
  if (lights){
    lights.fill.visible = q.lights;
    lights.rim.visible = q.lights;
  }

  // Resize the shadow map for the profile (frees the old one so it rebuilds).
  if (lights && lights.key){
    const k = lights.key;
    if (k.shadow.mapSize.x !== q.mapSize){
      k.shadow.mapSize.set(q.mapSize, q.mapSize);
      if (k.shadow.map){ k.shadow.map.dispose(); k.shadow.map = null; }
    }
  }

  setShadows(q.shadows);

  document.querySelectorAll('.qbtn').forEach((b) => {
    b.classList.toggle('active', b.dataset.q === key);
  });

  needsRender = true;
}

/* ============================ FPS METER ============================ */
function toggleFps(){
  fpsEnabled = !fpsEnabled;
  $('btnFps').classList.toggle('on', fpsEnabled);
  fpsBadge.classList.toggle('on', fpsEnabled);
  fpsCount = 0;
  fpsPrev = performance.now();
  if (fpsEnabled) fpsBadge.textContent = '— FPS';
}

function updateFps(){
  fpsCount++;
  const now = performance.now();
  const dt = now - fpsPrev;
  if (dt >= 500){
    fpsBadge.textContent = Math.round((fpsCount * 1000) / dt) + ' FPS';
    fpsCount = 0;
    fpsPrev = now;
  }
}

/* ============================ ANIMATIONS ============================ */
// Build the "+" menu from the available procedural animation types.
function buildAnimMenu(){
  const list = $('animMenuList');
  list.innerHTML = '';
  for (const [type, def] of Object.entries(ANIM_TYPES)){
    const b = document.createElement('button');
    b.className = 'menuitem';
    b.innerHTML = '<span>' + def.name + '</span><span class="plus">+</span>';
    b.addEventListener('click', () => addAnimation(type));
    list.appendChild(b);
  }
}

function addAnimation(type){
  const count = animInstances.filter(i => i.type === type).length + 1;
  const name = ANIM_TYPES[type].name + (count > 1 ? ' ' + count : '');
  animInstances.push({ key: 'a' + (++animSeq), type, name, active: false, phase: Math.random() * Math.PI * 2 });
  renderAnimChips();
}

// Each added animation gets its own toggle chip in the strip.
function renderAnimChips(){
  const strip = $('anims');
  strip.querySelectorAll('.animchip').forEach(c => c.remove());
  for (const inst of animInstances){
    const c = document.createElement('button');
    c.className = 'animchip' + (inst.active ? ' on' : '');
    c.dataset.key = inst.key;
    c.innerHTML = '<span class="led"></span>' + inst.name;
    c.addEventListener('click', () => {
      inst.active = !inst.active;
      c.classList.toggle('on', inst.active);
      needsRender = true;
    });
    strip.appendChild(c);
  }
}

function clearAnimations(){
  animInstances = [];
  renderAnimChips();
  needsRender = true;
}

function toggleAnimMenu(){
  $('animMenu').classList.toggle('on');
}

// Apply every ACTIVE animation once per frame. Returns true while any animation
// is running so the renderer keeps drawing (otherwise it stays on-demand).
// Always starts from the rest transform, so stopping one animation never
// affects the others.
function updateAnimations(){
  if (!animBase || !current) return false;
  const anyActive = animInstances.some(i => i.active);
  if (!anyActive){
    if (animWasActive){   // restore rest pose once
      current.root.position.copy(animBase.pos);
      current.root.rotation.copy(animBase.rot);
      current.root.scale.copy(animBase.scale);
      animWasActive = false;
      needsRender = true;
    }
    return false;
  }
  animWasActive = true;

  animCtx.root = current.root;
  animCtx.base = animBase;
  animCtx.t = performance.now() / 1000;
  const radius = fitInfo ? fitInfo.radius : 1;

  current.root.position.copy(animBase.pos);
  current.root.rotation.copy(animBase.rot);
  current.root.scale.copy(animBase.scale);

  for (const inst of animInstances){
    if (!inst.active) continue;
    const def = ANIM_TYPES[inst.type];
    animCtx.phase = inst.phase;
    animCtx.amp = radius * (def.amp || 0);
    def.apply(animCtx);
  }
  return true;
}

/* ============================ DISPOSE ============================ */
function disposeModel(root){
  root.traverse((o) => {
    if (o.isMesh){
      if (o.geometry) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
      for (const m of mats){
        for (const k in m){
          const v = m[k];
          if (v && v.isTexture) v.dispose();
        }
        m.dispose();
      }
    }
  });
  if (renderer) renderer.renderLists.dispose();
}

/* ==================== PREMIUM BOX (reuses the GLB's own clip) ==================== */
/* --- geometry helpers ------------------------------------------------------- */
function easeOutCubic(u){ return 1 - Math.pow(1 - u, 3); }
function easeInOutCubic(u){ return u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2; }
// Quadratic Bézier p0 -> p1(control) -> p2, evaluated at t and written into `out`.
function quadBezier(p0, p1, p2, t, out){
  const m = 1 - t;
  out.set(0, 0, 0)
     .addScaledVector(p0, m * m)
     .addScaledVector(p1, 2 * m * t)
     .addScaledVector(p2, t * t);
  return out;
}
// The holder lives in the box's LOCAL frame, so all trajectories are authored in
// local space (robust to any box transform/scale) with local up = +Y.
const UP_LOCAL = new THREE.Vector3(0, 1, 0);

// AABB of a named node translated into the root's local frame (root-agnostic to
// the translate/scale/rotate fitModel applies to the model).
function meshBoxInRoot(root, name){
  const node = root.getObjectByName(name);
  if (!node) return null;
  root.updateWorldMatrix(true, true);
  const world = new THREE.Box3().setFromObject(node);
  const v = new THREE.Vector3();
  const box = new THREE.Box3();
  const cs = [[world.min.x, world.min.y, world.min.z], [world.max.x, world.min.y, world.min.z],
              [world.min.x, world.max.y, world.min.z], [world.max.x, world.max.y, world.min.z],
              [world.min.x, world.min.y, world.max.z], [world.max.x, world.min.y, world.max.z],
              [world.min.x, world.max.y, world.max.z], [world.max.x, world.max.y, world.max.z]];
  for (const p of cs){
    v.set(p[0], p[1], p[2]);
    root.worldToLocal(v);
    box.expandByPoint(v);
  }
  return { min: box.min, max: box.max, size: box.getSize(new THREE.Vector3()) };
}

// Usable interior of the premium box (buildBox.ts: DIM 0.24 x 0.18, wall 0.003).
function premiumCavityMetrics(root){
  const b = meshBoxInRoot(root, 'Box_Base');
  if (!b) return null;
  const wall = 0.003;            // WALL_THICKNESS in buildBox.ts
  const openingY = b.max.y;      // flaps hinge on the wall top edge
  const floorTop = b.min.y + wall;
  return {
    cx: (b.min.x + b.max.x) / 2,
    cz: (b.min.z + b.max.z) / 2,
    cavW: b.size.x * 0.88,                       // internal opening minus side margins
    cavD: b.size.z * 0.88,
    cavH: (openingY - floorTop) * 0.85,          // headroom under the hinge line
    openingY,
    floorTop
  };
}

// Shift a freshly loaded scene so its bbox centre sits on its local origin.
function centerModelAtOrigin(root){
  const box = new THREE.Box3().setFromObject(root);
  root.position.sub(box.getCenter(new THREE.Vector3()));
}

// Soft radial "glow pad" texture for the halo sprite (one tiny canvas, no assets).
function makeGlowTexture(){
  const s = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,220,150,0.55)');
  g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function setContentGlow(st, v){
  const c = st.content;
  if (!c) return;
  const on = v > 0.01;
  c.light.visible = on;
  if (on) c.light.intensity = v * 0.45;   // warm light around the object only
  c.halo.visible = v > 0.02;
  if (c.halo.visible) c.halo.material.opacity = Math.min(1, v * 0.75);
}

/* --- content (sequential surprise characters born inside the premium box) ---- */
function setupPremiumContent(root){
  const holder = new THREE.Group();
  holder.name = 'BoxContentHolder';
  holder.visible = false;
  root.add(holder);

  const light = new THREE.PointLight(0xffd9a0, 0, 1.6, 2);
  light.name = 'BoxContentGlow';
  light.visible = false;
  holder.add(light);

  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTexture(),
    color: 0xffcf7f,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  }));
  halo.name = 'BoxContentHalo';
  halo.scale.set(0.42, 0.42, 1);
  holder.add(halo);

  const content = premiumState.content = {
    holder, light, halo, contentRoot: null, cavity: premiumCavityMetrics(root),
    scale0: 1, insideY: 0, showY: 0, cx: 0, cz: 0, contentH: 0,
    state: 'hidden', t0: 0, t1: 1, fromY: 0, toY: 0, active: false,
    pendingToken: 0, failed: false,
    // local-space trajectory for B (approach) and C (presentation) + close retreat
    pStartLocal: new THREE.Vector3(), pCtrlLocal: new THREE.Vector3(), pEndLocal: new THREE.Vector3(),
    floatBase: new THREE.Vector3(), floatPerp: new THREE.Vector3(),
    retreatFrom: new THREE.Vector3(), retreatCtrl: new THREE.Vector3(), retreatTo: new THREE.Vector3(),
    floatAmp: 0, floatTick: 0, approachReady: false, fromScale: 1
  };
}

// Eligible files, in selector order, minus the two boxes (never the surprise box itself).
function getContentSequence(){
  if (contentSequence) return contentSequence;
  const seen = new Set();
  contentSequence = [];
  document.querySelectorAll('.modelbtn').forEach((btn) => {
    const f = btn.dataset.model;
    if (!f || CONTENT_EXCLUDE.includes(f) || seen.has(f)) return;
    seen.add(f);
    contentSequence.push(f);
  });
  return contentSequence;
}

// Take the next eligible file and advance the session index (wraps at the end).
function nextContentFile(){
  const list = getContentSequence();
  if (!list.length) return null;
  const file = list[contentSeqIndex % list.length];
  contentSeqIndex = (contentSeqIndex + 1) % list.length;
  return file;
}

// Centre + fit a freshly loaded scene into the box cavity. Returns null if unusable.
function prepareContentEntry(croot){
  const b = premiumState && premiumState.content && premiumState.content.cavity;
  if (!b) return null;
  croot.traverse((o) => {
    if (o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material && 'envMapIntensity' in o.material) o.material.envMapIntensity = 1.0;
    }
  });
  centerModelAtOrigin(croot);
  const cs = new THREE.Box3().setFromObject(croot).getSize(new THREE.Vector3());
  if (cs.x < 1e-6 || cs.y < 1e-6 || cs.z < 1e-6) return null;
  const scale = Math.min(b.cavW / cs.x, b.cavD / cs.z, b.cavH / cs.y);
  croot.scale.setScalar(scale);
  centerModelAtOrigin(croot);   // scaling is about the origin, so re-centre the (now scaled) bbox
  const contentH = cs.y * scale;
  const insideY = b.floorTop + contentH / 2 + 0.002;
  const baseShowY = b.openingY + contentH / 2 + Math.max(0.03, b.cavH * 0.25);
  return {
    croot, scale0: scale, contentH, insideY, cx: b.cx, cz: b.cz,
    showY: baseShowY + CONTENT_RISE_BOOST * (baseShowY - insideY)
  };
}

// Keep the prepared-model cache bounded; never evict the character on screen.
function evictContentCache(){
  while (contentCache.size > CONTENT_CACHE_MAX){
    let removed = false;
    for (const [key, entry] of contentCache){
      const active = premiumState && premiumState.content && premiumState.content.contentRoot === entry.croot;
      if (active) continue;
      if (entry.croot.parent) entry.croot.parent.remove(entry.croot);
      disposeModel(entry.croot);
      contentCache.delete(key);
      removed = true;
      break;
    }
    if (!removed) break;
  }
}

// Swap the prepared character into the holder and (re)apply its metrics.
function applyContentEntry(st, entry){
  const c = st.content;
  if (c.contentRoot && c.contentRoot !== entry.croot && c.contentRoot.parent) c.contentRoot.parent.remove(c.contentRoot);
  c.contentRoot = entry.croot;
  c.scale0 = entry.scale0;
  c.contentH = entry.contentH;
  c.insideY = entry.insideY;
  c.showY = entry.showY;
  c.cx = entry.cx;
  c.cz = entry.cz;
  entry.croot.scale.setScalar(entry.scale0);
  c.holder.add(entry.croot);
  c.holder.position.set(entry.cx, entry.insideY, entry.cz);
  c.holder.visible = false;   // shown when the rise begins
  c.failed = false;
  needsRender = true;
}

function loadContentGltf(file, onLoad, onError){
  new GLTFLoader().load(new URL(file, location.href).href, onLoad, undefined, onError);
}

// On OPEN: advance the session index and load (or reuse) the next eligible model.
// Failures are logged and skipped, so the box never gets stuck.
function requestContentForOpen(st){
  const c = st.content;
  if (!c) return;
  if (!c.cavity){ c.failed = true; return; }   // no usable cavity: let the box open empty
  c.failed = false;
  c.pendingToken++;
  const myToken = c.pendingToken;
  const list = getContentSequence();
  let attempts = 0;

  const tryOnce = () => {
    if (premiumState !== st || c.pendingToken !== myToken || !st.open) return;   // superseded/closed
    if (attempts >= list.length){              // every eligible model failed: don't block the box
      console.warn('[premium] no eligible content model could be loaded');
      c.failed = true;
      return;
    }
    attempts++;
    const file = nextContentFile();
    if (!file){ c.failed = true; return; }
    const cached = contentCache.get(file);
    if (cached){ applyContentEntry(st, cached); return; }
    loadContentGltf(file,
      (gltf) => {
        if (premiumState !== st || c.pendingToken !== myToken){ disposeModel(gltf.scene); return; }
        const entry = prepareContentEntry(gltf.scene);
        if (!entry){ disposeModel(gltf.scene); console.warn('[premium] unusable mesh, skipping "' + file + '"'); tryOnce(); return; }
        contentCache.set(file, entry);
        evictContentCache();
        applyContentEntry(st, entry);
      },
      (err) => {
        console.error('[premium] failed to load "' + file + '":', (err && err.message) || err);
        tryOnce();   // skip to the next eligible model
      });
  };
  tryOnce();
}

// (B) Build the toward-camera glide at the instant the rise ends, using the LIVE
// camera orientation (works whatever way the user rotated before opening). The
// path is baked into the holder's LOCAL space so it follows the box and is immune
// to scaling/hierarchy issues.
function beginApproach(c, root, now){
  root.updateWorldMatrix(true, false);
  const startWorld = root.localToWorld(new THREE.Vector3(c.cx, c.showY, c.cz));
  const toCam = camera.position.clone().sub(startWorld);
  const dist = toCam.length();
  c.pStartLocal.set(c.cx, c.showY, c.cz);
  if (dist > 1e-4){
    toCam.multiplyScalar(1 / dist);
    const travel = dist * CONTENT_APPROACH_FRAC;         // 20% of the camera→object distance
    const endWorld = startWorld.clone().addScaledVector(toCam, travel);
    if (endWorld.y < startWorld.y) endWorld.y = startWorld.y;   // never lose the rise height
    c.pEndLocal.copy(root.worldToLocal(endWorld));
  } else {
    c.pEndLocal.copy(c.pStartLocal);
  }
  const dir = c.pEndLocal.clone().sub(c.pStartLocal);
  const len = Math.max(dir.length(), 1e-6);
  const mid = c.pStartLocal.clone().addScaledVector(dir, 0.5);
  const perp = new THREE.Vector3().crossVectors(dir, UP_LOCAL);
  if (perp.lengthSq() < 1e-8) perp.set(1, 0, 0);
  perp.normalize();
  c.pCtrlLocal.copy(mid)
    .addScaledVector(perp, len * CONTENT_CURVE)   // gentle sideways bow
    .addScaledVector(UP_LOCAL, len * CONTENT_ARC_LIFT);   // gentle upward bow
  c.approachReady = true;
  c.state = 'approach';
  c.t0 = now; c.t1 = now + CONTENT_APPROACH_MS;
}

// (C) Land into the idle presentation (stable exhibition scale + slow float).
function enterPresent(c, now){
  c.state = 'present';
  c.t0 = now;
  c.floatBase.copy(c.pEndLocal);
  const perp = new THREE.Vector3().crossVectors(c.pEndLocal.clone().sub(c.pStartLocal), UP_LOCAL);
  if (perp.lengthSq() < 1e-8) perp.set(1, 0, 0);
  c.floatPerp.copy(perp.normalize());
  c.floatAmp = c.contentH * CONTENT_FLOAT_AMP;
  c.floatTick = 0;
  if (c.contentRoot) c.contentRoot.scale.setScalar(c.scale0 * CONTENT_DISPLAY_SCALE);
}

// Close: author the retreat path from wherever the object floats back to over-the-box.
function beginRetreat(c, root, now){
  c.retreatFrom.copy(c.holder.position);
  c.retreatTo.set(c.cx, c.showY, c.cz);
  const dir = c.retreatTo.clone().sub(c.retreatFrom);
  const len = Math.max(dir.length(), 1e-6);
  const mid = c.retreatFrom.clone().addScaledVector(dir, 0.5);
  c.retreatCtrl.copy(mid).addScaledVector(UP_LOCAL, len * CONTENT_ARC_LIFT);
  c.state = 'retreat';
  c.t0 = now; c.t1 = now + CONTENT_RETREAT_MS;
  if (c.contentRoot){   // guarantee a valid starting scale for the descent
    const cur = c.contentRoot.scale.x / c.scale0;
    c.fromScale = isFinite(cur) ? cur : 1;
  }
}

// Advance the content choreography. Returns true when fully settled/hidden.
// Sets c.active = true while the scene still needs continuous redraws.
function updateContentMotion(st, now){
  const c = st.content;
  if (!c) return true;
  const root = st.root;
  const clamp01 = () => (c.t1 > c.t0) ? Math.max(0, Math.min(1, (now - c.t0) / (c.t1 - c.t0))) : 1;

  if (c.state === 'prep'){
    c.active = true;
    if (c.failed && !c.contentRoot){        // nothing loadable: open the box without a character
      c.state = 'hidden';
      c.active = false;
      return true;
    }
    if (!c.contentRoot) return false;       // still loading: don't rise yet
    if (now < c.t0) return false;           // waiting for the flaps to clear
    c.state = 'rising';
    c.t0 = now; c.t1 = now + CONTENT_RISE_MS;
    c.fromY = c.insideY; c.toY = c.showY;
    c.holder.visible = true;
  }
  if (c.state === 'rising'){
    c.active = true;
    const u = clamp01();
    const e = easeOutCubic(u);
    c.holder.position.x = c.cx; c.holder.position.z = c.cz;
    c.holder.position.y = c.fromY + (c.toY - c.fromY) * e;
    if (c.contentRoot) c.contentRoot.scale.setScalar(c.scale0 * (1 + 0.12 * Math.sin(Math.PI * u)));
    setContentGlow(st, 0.5 * Math.sin(Math.PI * u));
    if (u >= 1){
      c.holder.position.set(c.cx, c.showY, c.cz);
      if (c.contentRoot) c.contentRoot.scale.setScalar(c.scale0);
      beginApproach(c, root, now);          // -> phase B
    }
    return false;
  }
  if (c.state === 'approach'){
    c.active = true;
    const u = clamp01();
    const e = easeInOutCubic(u);
    quadBezier(c.pStartLocal, c.pCtrlLocal, c.pEndLocal, e, c.holder.position);
    if (c.contentRoot) c.contentRoot.scale.setScalar(c.scale0 * (1 + (CONTENT_DISPLAY_SCALE - 1) * e));
    setContentGlow(st, 0.28 * (1 - u));
    if (u >= 1) enterPresent(c, now);       // -> phase C
    return false;
  }
  if (c.state === 'present'){
    // idle float, updated every other frame (~30 fps) to stay light on Android
    c.floatTick = (c.floatTick + 1) % 2;
    if (c.floatTick !== 0){ c.active = false; return true; }
    const t = (now - c.t0) / CONTENT_FLOAT_MS;
    c.holder.position.copy(c.floatBase)
      .addScaledVector(UP_LOCAL, c.floatAmp * Math.sin(t * Math.PI * 2))
      .addScaledVector(c.floatPerp, c.floatAmp * 0.5 * Math.cos(t * Math.PI * 2));
    setContentGlow(st, 0.20 * Math.max(0, 1 - (now - c.t0) / CONTENT_PAUSE_MS));
    c.active = true;
    return true;                            // settled: keeps floating until closed
  }
  if (c.state === 'retreat'){
    c.active = true;
    const u = clamp01();
    const e = easeInOutCubic(u);
    quadBezier(c.retreatFrom, c.retreatCtrl, c.retreatTo, e, c.holder.position);
    if (c.contentRoot) c.contentRoot.scale.setScalar(c.scale0 * (c.fromScale + (1 - c.fromScale) * e));
    setContentGlow(st, 0.12 * (1 - u));
    if (u >= 1){
      c.holder.position.set(c.cx, c.showY, c.cz);
      c.state = 'sinking';
      c.t0 = now; c.t1 = now + CONTENT_SINK_MS;
      c.fromY = c.showY; c.toY = c.insideY;
    }
    return false;
  }
  if (c.state === 'sinking'){
    c.active = true;
    const u = clamp01();
    const e = easeOutCubic(u);
    c.holder.position.x = c.cx; c.holder.position.z = c.cz;
    c.holder.position.y = c.fromY + (c.toY - c.fromY) * e;
    if (c.contentRoot) c.contentRoot.scale.setScalar(c.scale0 * (1 - 0.05 * u));
    setContentGlow(st, 0.08 * (1 - u));
    if (u >= 1){
      c.holder.visible = false;
      c.holder.position.set(c.cx, c.insideY, c.cz);
      c.state = 'hidden';
      c.active = false;
      setContentGlow(st, 0);
      return true;
    }
    return false;
  }
  // hidden
  c.holder.visible = false;
  if (c.contentRoot) c.contentRoot.scale.setScalar(c.scale0);   // reset the character for its next turn
  c.holder.position.set(c.cx, c.insideY, c.cz);
  setContentGlow(st, 0);
  c.active = false;
  return true;
}

function updateBoxButtonLabel(){
  const el = document.getElementById('btnBoxLabel');
  if (!el) return;
  const st = activeBox();
  el.textContent = (st && st.open) ? '🔒 Cerrar caja' : '📦 Abrir caja';
}

// This GLB has four REAL flap nodes and its own baked opening animation. We do not
// re-invent the motion: we feed that clip to an AnimationMixer and scrub its time with
// the original choreography phase (buildBox.ts). Opening travels 0 -> HOLD_OPEN; closing
// travels forward through the closing half and lands on 0 (exactly as the source demo).
function resetPremiumBox(){
  if (!premiumState) return;
  // Release the content resources that disposeModel() cannot reach (Sprite halo is
  // not a Mesh): its material and the radial-gradient texture.
  const c = premiumState.content;
  if (c && c.halo){
    if (c.halo.material && c.halo.material.map) c.halo.material.map.dispose();
    if (c.halo.material) c.halo.material.dispose();
  }
  // Dispose every prepared character (the active one included) and empty the cache.
  // contentSeqIndex is intentionally NOT reset: the surprise sequence is session-wide.
  for (const entry of contentCache.values()){
    if (entry.croot.parent) entry.croot.parent.remove(entry.croot);
    disposeModel(entry.croot);
  }
  contentCache.clear();
  premiumState.mixer.stopAllAction();
  premiumState.mixer.uncacheRoot(premiumState.root);
  premiumState = null;
}

// --- original choreography, ported verbatim from buildBox.ts (fallback only) ---
function premiumSeg(t, a, b, from, to){
  if (t <= a) return from;
  if (t >= b) return to;
  const u = (t - a) / (b - a);
  const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;   // easeInOutCubic
  return from + (to - from) * e;
}
// [frontBack, leftRight] normalised 0..1 over one cycle; majors clear before minors.
function premiumFlapSequence(p){
  const q = ((p % 1) + 1) % 1;
  const fb = q < 0.5 ? premiumSeg(q, 0.07, 0.21, 0, 1) : premiumSeg(q, 0.8, 0.94, 1, 0);
  const lr = q < 0.5 ? premiumSeg(q, 0.25, 0.39, 0, 1) : premiumSeg(q, 0.62, 0.76, 1, 0);
  return [fb, lr];
}

// Faithful clip rebuilt from the original math, used only if the GLB carries no clip.
function buildPremiumClip(){
  const fps = 30;
  const frames = Math.round(PREMIUM_CYCLE * fps) + 1;
  const times = new Float32Array(frames);
  for (let i = 0; i < frames; i++) times[i] = i / fps;
  const tracks = [];
  const q = new THREE.Quaternion();
  for (const name of PREMIUM_FLAPS){
    const info = PREMIUM_PIVOTS[name];
    const vals = new Float32Array(frames * 4);
    for (let i = 0; i < frames; i++){
      const [fb, lr] = premiumFlapSequence(times[i] / PREMIUM_CYCLE);
      const t = (name === 'Flap_Front' || name === 'Flap_Back') ? fb : lr;
      q.setFromAxisAngle(info.axis, info.sign * t * PREMIUM_OPEN_ANGLE);
      vals[i * 4 + 0] = q.x; vals[i * 4 + 1] = q.y; vals[i * 4 + 2] = q.z; vals[i * 4 + 3] = q.w;
    }
    tracks.push(new THREE.QuaternionKeyframeTrack(`${name}.quaternion`, times, vals));
  }
  return new THREE.AnimationClip('Flap_Open_Close', PREMIUM_CYCLE, tracks);
}

function setupPremiumBox(root, animations){
  const found = PREMIUM_FLAPS.filter((n) => root.getObjectByName(n));
  if (found.length < PREMIUM_FLAPS.length) return;   // not the premium box
  // Prefer the box's OWN exported clip; fall back to the ported choreography.
  let clip = (animations || []).find((a) => a && a.tracks && a.tracks.some((t) => /Flap_/.test(t.name)));
  if (!clip || !clip.tracks.length) clip = buildPremiumClip();
  const mixer = new THREE.AnimationMixer(root);
  const action = mixer.clipAction(clip);
  action.play();   // we position it by scrubbing (mixer.setTime), never by advancing dt
  premiumState = {
    root, mixer, action, clip,
    duration: clip.duration || PREMIUM_CYCLE,
    phase: 0, open: false, animating: false, lastT: 0,
    content: null
  };
  mixer.setTime(0);   // start fully closed
  setupPremiumContent(root);   // sequential surprise characters live inside this box
  updateBoxButtonLabel();
  const wrap = document.getElementById('boxControls');
  if (wrap) wrap.classList.add('show');
  needsRender = true;
}

function togglePremiumBox(){
  if (!premiumState || premiumState.animating) return;   // ignore taps while animating
  const st = premiumState;
  st.open = !st.open;
  st.animating = true;
  st.lastT = performance.now();
  const c = st.content;
  if (c){
    if (st.open){
      c.state = 'prep';                  // wait CONTENT_OPEN_DELAY, then rise
      c.t0 = st.lastT + CONTENT_OPEN_DELAY;
      c.failed = false;
      c.active = true;
      requestContentForOpen(st);         // pick + load (or reuse) the next eligible character
    } else {
      c.pendingToken++;                  // cancel any in-flight load for the closing box
      c.failed = false;
      c.holder.visible = true;
      beginRetreat(c, st.root, st.lastT);   // glide back over the box, then sink
      c.active = true;
    }
  }
  updateBoxButtonLabel();
  needsRender = true;
}

function updatePremiumBox(){
  const st = premiumState;
  if (!st) return false;
  const now = performance.now();

  let phaseReached = false;
  if (st.animating){
    let dt = (now - st.lastT) / 1000;
    st.lastT = now;
    dt = Math.min(dt, 0.05);
    const target = st.open ? PREMIUM_HOLD_OPEN : 0;
    const fwd = target >= st.phase ? target - st.phase : 1 - st.phase + target;   // forward travel
    const step = dt * PREMIUM_TRAVEL_SPEED;
    phaseReached = fwd < 1e-6 || step >= fwd;
    st.phase = phaseReached ? target : (st.phase + step) % 1;
    st.mixer.setTime(st.phase * st.duration);   // scrub the GLB's own clip to that phase
  }

  const motionDone = updateContentMotion(st, now);

  if (st.animating && phaseReached && motionDone){
    st.animating = false;                // flaps arrived AND the content settled
    updateBoxButtonLabel();              // done: offer the opposite action
  }

  const c = st.content;
  const busy = st.animating || (c && c.active);
  return busy;
}

/* ==================== MYSTERY BOX ("Caja sorpresa") ==================== */
// The GLB's own animation is empty, so the four flap pivots are driven here with
// the original staggered choreography: each pivot eases independently from its
// current angle to the target, offset in time (open: index order, close: reverse).
function setupMysteryBox(root){
  const entries = [];
  for (const def of MYSTERY_FLAPS){
    const pivot = root.getObjectByName(def.node);
    if (!pivot) return;                    // not the mystery box: leave it alone
    pivot.rotation[def.axis] = 0;          // rest pose: fully closed
    entries.push({ pivot, axis: def.axis, angle: def.angle, from: 0, to: 0, startsAt: 0, duration: 0, done: true });
  }
  mysteryState = { root, entries, open: false, animating: false };
  updateBoxButtonLabel();
  const wrap = document.getElementById('boxControls');
  if (wrap) wrap.classList.add('show');
  needsRender = true;
}

function toggleMysteryBox(){
  if (!mysteryState || mysteryState.animating) return;   // ignore taps while animating
  const st = mysteryState;
  st.open = !st.open;
  st.animating = true;
  const now = performance.now();
  const n = st.entries.length;
  st.entries.forEach((e, i) => {
    e.from = e.pivot.rotation[e.axis];
    e.to = st.open ? e.angle : 0;
    e.startsAt = now + (st.open ? i * MYSTERY_OPEN_STAGGER : (n - 1 - i) * MYSTERY_CLOSE_STAGGER);
    e.duration = st.open ? MYSTERY_OPEN_MS : MYSTERY_CLOSE_MS;
    e.done = false;
  });
  updateBoxButtonLabel();
  needsRender = true;
}

function updateMysteryBox(){
  const st = mysteryState;
  if (!st || !st.animating) return false;
  const now = performance.now();
  let allDone = true;
  for (const e of st.entries){
    if (e.done) continue;
    if (now < e.startsAt){ allDone = false; continue; }   // staggered: not started yet
    const p = Math.min(1, (now - e.startsAt) / e.duration);
    e.pivot.rotation[e.axis] = e.from + (e.to - e.from) * easeOutCubic(p);
    if (p >= 1){ e.pivot.rotation[e.axis] = e.to; e.done = true; }
    else allDone = false;
  }
  if (allDone){
    st.animating = false;
    updateBoxButtonLabel();                 // done: offer the opposite action
  }
  return st.animating;
}

function resetMysteryBox(){
  if (!mysteryState) return;
  for (const e of mysteryState.entries) e.pivot.rotation[e.axis] = 0;   // back to closed
  mysteryState = null;
}

// The single "Abrir caja / Cerrar caja" button drives whichever box is loaded.
function activeBox(){ return premiumState || mysteryState; }

function toggleBoxControl(){
  if (premiumState) togglePremiumBox();
  else if (mysteryState) toggleMysteryBox();
}

// Stop both box controls and hide the button (called on every model change).
function resetBoxes(){
  resetPremiumBox();
  resetMysteryBox();
  const wrap = document.getElementById('boxControls');
  if (wrap) wrap.classList.remove('show');
}

/* ============================ UI ============================ */
function bindUI(){
  const modelsRow = $('models');
  const modelsWrap = $('modelsWrap');

  // Show/hide the subtle edge fades depending on the scroll position of the row.
  function updateModelsHint(){
    if (!modelsRow || !modelsWrap) return;
    const max = modelsRow.scrollWidth - modelsRow.clientWidth;
    modelsWrap.classList.toggle('can-left', modelsRow.scrollLeft > 2);
    modelsWrap.classList.toggle('can-right', modelsRow.scrollLeft < max - 2);
  }

  document.querySelectorAll('.modelbtn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('active')) return;
      document.querySelectorAll('.modelbtn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      // Bring the chosen card fully into view inside the horizontal row.
      btn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
      loadModel(btn.dataset.model, btn.dataset.label);
    });
  });

  if (modelsRow){
    modelsRow.addEventListener('scroll', updateModelsHint, { passive:true });
    window.addEventListener('resize', updateModelsHint);
    requestAnimationFrame(updateModelsHint);   // run once layout is known
  }

  $('btnRotate').addEventListener('click', (e) => {
    autoRotate = !autoRotate;
    controls.autoRotate = autoRotate;
    e.currentTarget.classList.toggle('on', autoRotate);
    needsRender = true;
  });

  $('btnReset').addEventListener('click', () => {
    if (current) resetCamera();
  });

  $('btnBox').addEventListener('click', toggleBoxControl);

  $('btnLight').addEventListener('click', (e) => {
    const light = document.documentElement.classList.toggle('light');
    scene.background.set(light ? LIGHT_BG : DARK_BG);
    if (ground) ground.material.color.set(light ? 0xd8dde8 : 0x1a1f2b);
    e.currentTarget.classList.toggle('on', light);
    needsRender = true;
  });

  $('btnGround').addEventListener('click', (e) => {
    const on = !ground.visible;
    ground.visible = on;
    e.currentTarget.classList.toggle('on', on);
    needsRender = true;
  });

  $('btnShadow').addEventListener('click', () => {
    setShadows(!shadowEnabled);
  });

  $('btnFps').addEventListener('click', toggleFps);

  buildAnimMenu();
  $('btnAddAnim').addEventListener('click', toggleAnimMenu);
  $('btnCloseAnim').addEventListener('click', () => $('animMenu').classList.remove('on'));
  $('btnClearAnims').addEventListener('click', () => { clearAnimations(); $('animMenu').classList.remove('on'); });
  // Close the menu when tapping outside it (e.g. on the 3D view).
  document.addEventListener('pointerdown', (e) => {
    if (!$('animMenu').classList.contains('on')) return;
    if (e.target.closest('#animMenu') || e.target.closest('#btnAddAnim')) return;
    $('animMenu').classList.remove('on');
  });

  document.querySelectorAll('.qbtn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('active')) return;
      applyQuality(btn.dataset.q);
    });
  });

  $('btnFullscreen').addEventListener('click', toggleFullscreen);
  $('btnRetry').addEventListener('click', () => {
    const active = document.querySelector('.modelbtn.active');
    if (active) loadModel(active.dataset.model, active.dataset.label);
  });
}

function toggleFullscreen(){
  const el = document.documentElement;
  if (!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (()=>{})).call(document);
  }
  // Layout settles asynchronously; the fullscreenchange listener triggers the
  // debounced resize, so no extra direct onResize() call is needed here.
}

function showLoading(label){
  statusDot.className = 'dot busy';
  modelName.textContent = label + ' · cargando…';
  loadingEl.classList.remove('hidden');
  errorBox.style.display = 'none';
  loadText.textContent = 'Cargando ' + label + '…';
  progressBar.style.width = '0%';
  loadPct.textContent = '';
}

function hideLoading(){ loadingEl.classList.add('hidden'); }

function showError(file, err){
  console.error('[Visor3D] Error cargando', file, err);
  statusDot.className = 'dot err';
  modelName.textContent = 'Error';
  loadingEl.classList.remove('hidden');
  loadText.textContent = '';
  progressBar.style.width = '0%';
  loadPct.textContent = '';
  errorBox.style.display = 'block';
  const isFile = location.protocol === 'file:';
  errorMsg.textContent = 'No se pudo cargar "' + file + '". ' + (err && err.message ? err.message : '');
  errorHint.innerHTML = isFile
    ? 'Parece que abriste el archivo con <code>file://</code>. Los navegadores bloquean la carga de modelos locales por seguridad. Ejecuta un servidor HTTP local en Termux desde esta carpeta: <code>python3 -m http.server 8080</code> y abre <code>http://localhost:8080/visor-3d.html</code>.'
    : 'Comprueba que el archivo existe en la misma carpeta y que el servidor está sirviendo <code>.glb</code> correctamente.';
}

/* ============================ MISC ============================ */
// Debounced so bursts of resize/orientation/fullscreen events collapse into a
// single layout + render instead of one per event.
function onResize(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resizeTimer = null;
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    applyPixelRatio();
    renderer.setSize(w, h, false);
    reframeCamera(true);
  }, 120);
}

// On-demand render loop: rAF keeps running (cheap controls.update), but the GPU
// only draws when something actually changed (interaction, damping, autorotate
// or an active animation).
function loop(){
  requestAnimationFrame(loop);
  controls.update();  // returns true while interacting / damping / autorotating
  const animating = updateAnimations();
  const premiumAnimating = updatePremiumBox();
  const mysteryAnimating = updateMysteryBox();
  if (needsRender || controls.autoRotate || animating || premiumAnimating || mysteryAnimating){
    renderer.render(scene, camera);
    needsRender = false;
    if (fpsEnabled) updateFps();
  }
}

let hintHidden = false;
function hideHintOnInteract(){
  const hide = () => { if (!hintHidden){ hintHidden = true; hint.style.opacity = '0'; } };
  canvas.addEventListener('pointerdown', hide, { once:true });
  setTimeout(hide, 6000);
}

function fmtBytes(b){
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i];
}
